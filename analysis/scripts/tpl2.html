<title>Пулы 20 августа</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#13151c; --surf:#1a1d26; --raise:#222633; --line:#2d3240; --line2:#3a4052;
  --tx:#e2e6ef; --mut:#8a92a6; --dim:#666d80;
  --gold:#d9a441; --teal:#4a9bb5; --good:#54a878; --bad:#c25b62; --warn:#c98a3e;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--body);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
h1,h2,h3,h4{font-family:var(--cond);font-weight:600;text-wrap:balance;margin:0}
.num,td{font-variant-numeric:tabular-nums}
header{border-bottom:1px solid var(--line);padding:34px 0 0;background:var(--surf)}
.eyebrow{font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;
  font-size:12px;color:var(--gold);font-weight:600}
h1{font-size:34px;letter-spacing:-.01em;margin:8px 0 6px}
.sub{color:var(--mut);font-size:15px;max-width:72ch;margin-bottom:22px}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{font-family:var(--cond);font-size:14px;font-weight:600;background:none;border:0;
  border-bottom:2px solid transparent;color:var(--mut);padding:11px 14px;cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--tx)}
nav button[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
nav button:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
main{padding:30px 0 80px}
section[hidden]{display:none}
.blk{margin-bottom:32px}
.blk>h2{font-size:20px;margin-bottom:4px}
.blk>.note{color:var(--mut);font-size:14px;max-width:76ch;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:3px;padding:13px 15px}
.tile .k{font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;
  color:var(--mut);font-weight:600}
.tile .v{font-family:var(--mono);font-size:24px;font-weight:600;margin-top:3px;line-height:1.15}
.tile .c{font-size:12.5px;color:var(--dim);margin-top:2px}
.tile.g .v{color:var(--good)} .tile.b .v{color:var(--bad)} .tile.a .v{color:var(--gold)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:3px;background:var(--surf)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-family:var(--cond);text-transform:uppercase;letter-spacing:.07em;font-size:10.5px;
  color:var(--mut);font-weight:600;text-align:right;padding:9px 11px;
  border-bottom:1px solid var(--line2);white-space:nowrap;background:var(--raise)}
th:first-child,td:first-child{text-align:left}
th.l,td.l{text-align:left}
td+td.l{padding-left:18px}
td{padding:8px 11px;text-align:right;border-bottom:1px solid var(--line);
  font-family:var(--mono);white-space:nowrap}
td.l{font-family:var(--body);white-space:normal}
tbody tr:last-child td{border-bottom:0}
tr.tot td{background:var(--raise);font-weight:600;border-top:1px solid var(--line2)}
tr.clk{cursor:pointer} tr.clk:hover td{background:#20242f}
.id{color:var(--gold);font-weight:600}
.good{color:var(--good)} .bad{color:var(--bad)} .mut{color:var(--mut)} .warn{color:var(--warn)}
.tag{font-family:var(--cond);font-size:10px;font-weight:600;text-transform:uppercase;
  letter-spacing:.06em;padding:1px 6px;border-radius:2px;border:1px solid;display:inline-block}
.t-ВЧ{color:var(--gold);border-color:#5c4a24;background:#241d0f}
.t-СЧ{color:var(--teal);border-color:#28495a;background:#0f1e26}
.t-НЧ{color:var(--dim);border-color:var(--line2);background:var(--raise)}
.pill{font-family:var(--cond);font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:9px;display:inline-block}
.p-ok{background:#16301f;color:var(--good);border:1px solid #27512f}
.p-no{background:#2e1518;color:var(--bad);border:1px solid #522a2d}
.p-mid{background:#2e2412;color:var(--warn);border:1px solid #55401d}
.det td{background:#171a22;padding:0;border-bottom:1px solid var(--line2)}
.det .inner{padding:16px 18px;display:grid;gap:16px}
.det h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin-bottom:8px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:3px;padding:16px 18px}
.card.acc{border-left:2px solid var(--gold)}
.card.ok{border-left:2px solid var(--good)}
.card.err{border-left:2px solid var(--bad)}
.card h3{font-size:16px;margin-bottom:6px}
.card p{margin:0;font-size:14px;color:var(--mut)} .card p+p{margin-top:8px}
.card b{color:var(--tx)}
.card .big{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--tx)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:13px}
ul.cl{margin:0;padding-left:19px;font-size:14px;color:var(--mut)}
ul.cl li{margin-bottom:6px} ul.cl li::marker{color:var(--gold)}
ul.cl b{color:var(--tx);font-weight:600}
.foot{border-top:1px solid var(--line);margin-top:40px;padding-top:16px;color:var(--dim);font-size:12.5px}
@media (max-width:640px){h1{font-size:26px}.wrap{padding:0 15px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<header><div class="wrap">
  <div class="eyebrow">Запуск 20.08.2026 · два замера · 40 доменов · срез по ТОП-10</div>
  <h1>Пулы 20 августа</h1>
  <p class="sub">Разбор шести групп по доменам, брендам и конкретным ключам. Всё считано по <b style="color:var(--tx)">ТОП-10</b>. Замер 1 — 20.08 в 01:29–01:41, замер 2 — 20.08 в 10:08–10:09. Тиры: ВЧ ≥ 1 млн, СЧ 700k–1 млн. Бренды vovan и pari исключены.</p>
  <nav id="nav"></nav>
</div></header>
<main class="wrap" id="main"></main>
