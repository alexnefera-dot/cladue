<title>Ключи по брендам</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#13151c;--surf:#1a1d26;--raise:#222633;--line:#2d3240;--line2:#3a4052;
  --tx:#e2e6ef;--mut:#8a92a6;--dim:#666d80;
  --gold:#d9a441;--teal:#4a9bb5;--good:#54a878;--bad:#c25b62;--warn:#c98a3e;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1500px;margin:0 auto;padding:0 22px}
h1,h2,h3,h4{font-family:var(--cond);font-weight:600;text-wrap:balance;margin:0}
td,th{font-variant-numeric:tabular-nums}
header{border-bottom:1px solid var(--line);padding:30px 0 0;background:var(--surf)}
.eyebrow{font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--gold);font-weight:600}
h1{font-size:32px;letter-spacing:-.01em;margin:7px 0 5px}
.sub{color:var(--mut);font-size:14.5px;max-width:90ch;margin-bottom:20px}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{font-family:var(--cond);font-size:14px;font-weight:600;background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:11px 14px;cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--tx)}
nav button[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
nav button:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
main{padding:26px 0 80px}
section[hidden]{display:none}
.blk{margin-bottom:34px}
.blk>h2{font-size:21px;margin-bottom:5px}
h3.vt{font-size:18px;margin-bottom:4px}
p.note,.blk>.note{color:var(--mut);font-size:13.5px;max-width:100ch;margin:0 0 13px}
p.verd{margin:12px 0 0;padding:11px 14px;background:var(--surf);border-left:2px solid var(--gold);border-radius:0 3px 3px 0;font-size:14px;max-width:110ch}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:3px;background:var(--surf)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-family:var(--cond);text-transform:uppercase;letter-spacing:.06em;font-size:10px;color:var(--mut);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;background:var(--raise);vertical-align:bottom}
th:first-child,td:first-child{text-align:left}
th.l,td.l{text-align:left}
td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);font-family:var(--mono);white-space:nowrap;vertical-align:top}
td.l{font-family:var(--body);white-space:normal}
td.l.mono{font-family:var(--mono);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tr.p2 td{border-top:0}
tr.tr-bad td{background:#1d1519}
tr.cohh td{background:var(--raise);font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;color:var(--gold);font-weight:600;padding:7px 10px}
table.big{font-size:12.5px}
.good{color:var(--good)}.bad{color:var(--bad)}.mut{color:var(--mut)}.warn{color:var(--warn)}
.strike{text-decoration:line-through}
.now{color:var(--gold);font-weight:600}
.ar{color:var(--dim);padding:0 4px}
.sm{font-size:11.5px;line-height:1.4}
.mono{font-family:var(--mono)}
.tag{font-family:var(--cond);font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:1px 5px;border-radius:2px;border:1px solid var(--line2);background:var(--raise);color:var(--dim);display:inline-block}
.tag.ex{color:var(--bad);border-color:#522a2d;background:#2e1518}
.t-ВЧ{color:var(--gold)}.t-СЧ{color:var(--teal)}.t-НЧ{color:var(--mut)}
.kq{display:inline-block;background:var(--raise);border:1px solid var(--line);border-radius:2px;padding:1px 5px;margin:1px 2px 1px 0;font-size:11px;font-family:var(--mono)}
.kq b{color:var(--tx)}
.pill{font-family:var(--cond);font-size:10px;font-weight:600;padding:1px 6px;border-radius:9px;display:inline-block;white-space:nowrap}
.p-no{background:#2e1518;color:var(--bad);border:1px solid #522a2d}
.p-t{background:#241d0f;color:var(--gold);border:1px solid #5c4a24}
.gcard{border:1px solid var(--line);border-radius:3px;background:var(--surf);padding:16px 18px;margin-bottom:16px}
.gh{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:10px}
.gh h3{font-size:17px}
.gt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta{display:flex;flex-wrap:wrap;gap:6px 20px;margin-bottom:12px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.meta>div{display:flex;flex-direction:column;gap:1px}
.mk{font-family:var(--cond);text-transform:uppercase;letter-spacing:.09em;font-size:9.5px;color:var(--dim);font-weight:600}
.mv{font-size:13px;font-family:var(--mono);color:var(--tx)}
.brow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:11px 0}
.brow .mk{margin-right:6px}
.bch{font-size:11.5px;font-family:var(--mono);background:var(--raise);border:1px solid var(--line);border-radius:2px;padding:1px 6px;color:var(--mut)}
.bch b{color:var(--gold)}
.vsnames{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.vn{font-family:var(--mono);font-size:13px;padding:3px 9px;border-radius:2px;border:1px solid var(--line);background:var(--raise)}
.vn.a{border-left:2px solid var(--teal)}.vn.b{border-left:2px solid var(--warn)}
.vs{color:var(--dim);font-size:12px;font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em}
.card{background:var(--surf);border:1px solid var(--line);border-radius:3px;padding:16px 18px}
.card h3{font-size:15.5px;margin-bottom:6px}
.card p{margin:0 0 8px;font-size:13.5px}
.card p:last-child{margin-bottom:0}
.card.warn-c{border-left:2px solid var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:13px}
code{font-family:var(--mono);font-size:.9em;background:var(--raise);padding:1px 4px;border-radius:2px}
footer{border-top:1px solid var(--line);padding:18px 0 40px;color:var(--dim);font-size:12px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:3px;padding:13px 15px}
.tile .k{font-family:var(--cond);text-transform:uppercase;letter-spacing:.09em;font-size:10px;color:var(--mut);font-weight:600;line-height:1.3}
.tile .v{font-family:var(--mono);font-size:26px;font-weight:600;margin-top:4px;line-height:1.1}
.tile .c{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.4}
.tile.g .v{color:var(--good)}.tile.b .v{color:var(--bad)}.tile.a .v{color:var(--gold)}
.dm{font-family:var(--mono);font-size:13px}
.tr{font-family:var(--cond);font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:1px 5px;border-radius:2px;border:1px solid;display:inline-block;vertical-align:middle}
.tr-ВЧ{color:var(--gold);border-color:#5c4a24;background:#241d0f}
.tr-СЧ{color:var(--teal);border-color:#28495a;background:#0f1e26}
.tr-НЧ{color:var(--dim);border-color:var(--line2);background:var(--raise)}
.tr-нет{color:var(--bad);border-color:#522a2d;background:#2e1518}
.bch{display:inline-block;background:var(--raise);border:1px solid var(--line);border-radius:2px;padding:1px 6px;margin:1px 3px 1px 0;font-size:11.5px;font-family:var(--mono);color:var(--mut)}
.bch b{color:var(--gold)}
.det td{background:#171a22;padding:0;border-bottom:1px solid var(--line2)}
.det .inner{padding:15px 18px}
.det .inner p{font-size:13.5px;margin:0 0 8px}
p.warn{color:var(--warn)}
.url{display:inline-block;max-width:40ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
