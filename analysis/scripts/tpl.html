<title>Доргены: пересчёт позиций</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#13151c; --surf:#1a1d26; --raise:#222633; --line:#2d3240; --line2:#3a4052;
  --tx:#e2e6ef; --mut:#8a92a6; --dim:#666d80;
  --gold:#d9a441; --teal:#4a9bb5; --good:#54a878; --bad:#c25b62; --warn:#c98a3e;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--body);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--cond);font-weight:600;text-wrap:balance;margin:0}
a{color:var(--gold)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

header{border-bottom:1px solid var(--line);padding:34px 0 0;background:var(--surf)}
.eyebrow{font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;
  font-size:12px;color:var(--gold);font-weight:600}
h1{font-size:34px;letter-spacing:-.01em;margin:8px 0 6px}
.sub{color:var(--mut);font-size:15px;max-width:70ch;margin-bottom:22px}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
nav button{font-family:var(--cond);font-size:14px;font-weight:600;letter-spacing:.02em;
  background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);
  padding:11px 15px;cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--tx)}
nav button[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
nav button:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}

main{padding:30px 0 80px}
section[hidden]{display:none}
.blk{margin-bottom:34px}
.blk>h2{font-size:20px;margin-bottom:4px}
.blk>.note{color:var(--mut);font-size:14px;max-width:74ch;margin-bottom:14px}
.blk>.note:last-child{margin-bottom:0}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:26px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:3px;padding:13px 15px}
.tile .k{font-family:var(--cond);text-transform:uppercase;letter-spacing:.1em;
  font-size:10.5px;color:var(--mut);font-weight:600}
.tile .v{font-family:var(--mono);font-size:25px;font-weight:600;margin-top:3px;
  font-variant-numeric:tabular-nums;line-height:1.15}
.tile .c{font-size:12.5px;color:var(--dim);margin-top:2px}
.tile.g .v{color:var(--good)} .tile.b .v{color:var(--bad)} .tile.a .v{color:var(--gold)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:3px;background:var(--surf)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-family:var(--cond);text-transform:uppercase;letter-spacing:.07em;font-size:10.5px;
  color:var(--mut);font-weight:600;text-align:right;padding:9px 11px;
  border-bottom:1px solid var(--line2);white-space:nowrap;background:var(--raise)}
th:first-child,td:first-child{text-align:left}
th.l,td.l{text-align:left}
td{padding:8px 11px;text-align:right;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.l{font-family:var(--body)}
tbody tr:last-child td{border-bottom:0}
tr.tot td{background:var(--raise);font-weight:600;border-top:1px solid var(--line2)}
tr.clk{cursor:pointer}
tr.clk:hover td{background:#20242f}
.id{color:var(--gold);font-weight:600}
.good{color:var(--good)} .bad{color:var(--bad)} .mut{color:var(--mut)} .warn{color:var(--warn)}
.tag{font-family:var(--cond);font-size:10.5px;font-weight:600;text-transform:uppercase;
  letter-spacing:.06em;padding:2px 7px;border-radius:2px;border:1px solid;display:inline-block}
.t-vch{color:var(--gold);border-color:#5c4a24;background:#241d0f}
.t-sch{color:var(--teal);border-color:#28495a;background:#0f1e26}
.t-nch{color:var(--dim);border-color:var(--line2);background:var(--raise)}
.pill{font-family:var(--cond);font-size:10.5px;font-weight:600;padding:2px 7px;
  border-radius:9px;display:inline-block;letter-spacing:.03em}
.p-ok{background:#16301f;color:var(--good);border:1px solid #27512f}
.p-no{background:#2e1518;color:var(--bad);border:1px solid #522a2d}
.p-mid{background:#2e2412;color:var(--warn);border:1px solid #55401d}

.spark{display:inline-flex;align-items:flex-end;gap:2px;height:22px;vertical-align:middle}
.spark i{width:6px;background:var(--line2);border-radius:1px;min-height:2px;display:block}
.spark i.hi{background:var(--gold)}
.det td{background:#171a22;padding:0;border-bottom:1px solid var(--line2)}
.det .inner{padding:14px 16px}
.det h4{font-family:var(--cond);font-size:12px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--mut);margin:0 0 9px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:var(--mono);font-size:11.5px;padding:3px 8px;border-radius:2px;
  background:var(--raise);border:1px solid var(--line);color:var(--mut)}
.chip b{color:var(--tx);font-weight:500}
.chip.v{border-color:#5c4a24;background:#211a0d} .chip.v b{color:var(--gold)}
.chip.s{border-color:#28495a;background:#0e1b22} .chip.s b{color:var(--teal)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:13px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:3px;padding:15px 17px}
.card.acc{border-left:2px solid var(--gold)}
.card.err{border-left:2px solid var(--bad)}
.card.ok{border-left:2px solid var(--good)}
.card h3{font-size:15px;margin-bottom:5px}
.card p{margin:0;font-size:13.5px;color:var(--mut)}
.card p+p{margin-top:8px}
.card .big{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--tx)}

ul.cl{margin:0;padding-left:19px;font-size:14px;color:var(--mut)}
ul.cl li{margin-bottom:6px} ul.cl li::marker{color:var(--gold)}
ul.cl b{color:var(--tx);font-weight:600}
.foot{border-top:1px solid var(--line);margin-top:40px;padding-top:16px;
  color:var(--dim);font-size:12.5px}
@media (max-width:640px){h1{font-size:26px}.wrap{padding:0 15px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header>
  <div class="wrap">
    <div class="eyebrow">Пересчёт архива D231–D274 · 572 домена · 33 запуска</div>
    <h1>Доргены: пересчёт позиций</h1>
    <p class="sub">Единое правило по всему архиву: последний замер, СЧ от 700k, накрученные домены
    и бренды vovan/pari исключены. Четыре вывода из старого чата не подтвердились.</p>
    <nav id="nav"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>

const D = __DATA__;
</script>
