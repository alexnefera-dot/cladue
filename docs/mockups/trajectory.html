<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipboy · Траектории к 10 — мокап</title>
<style>
  :root{
    --bg:#f6f7f9;--bg2:#eef0f4;--panel:#fff;--line:#e2e7ed;--line2:#d6dce4;
    --green:#1e9e57;--green-dim:#5cb585;--green-soft:rgba(30,158,87,.10);
    --text:#141e28;--muted:#4f5f6f;--nav:#364656;--amber:#a87708;--red:#c43f3f;--blue:#2a76b5;--violet:#6b4fb5;
    --shadow-sm:0 1px 2px rgba(18,28,45,.05),0 1px 4px rgba(18,28,45,.05);--shadow-md:0 6px 20px rgba(18,28,45,.10);
    --mono:"SF Mono","JetBrains Mono",ui-monospace,monospace;--sans:-apple-system,"SF Pro Text","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
  .titlebar{height:40px;background:var(--bg2);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;font:600 12px var(--mono);color:var(--green);letter-spacing:1px;position:sticky;top:0;z-index:5}
  .wrap{max-width:960px;margin:0 auto;padding:18px 22px 60px}
  .crumb{font-size:12px;color:var(--muted);margin-bottom:12px}.crumb a{color:var(--green);cursor:pointer}.crumb b{color:var(--text)}
  h1{font-size:23px;letter-spacing:-.02em;margin:0 0 2px}.sub{color:var(--muted);margin-bottom:16px;font-size:13.5px}
  .muted{color:var(--muted)}
  .sphlbl{font:600 10.5px var(--mono);letter-spacing:1.4px;color:var(--green);text-transform:uppercase;margin:18px 0 8px}

  /* ===== главная: трассы ===== */
  .dir{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow-sm);padding:13px 16px;margin-bottom:10px;cursor:pointer;transition:.12s}
  .dir:hover{border-color:var(--green-dim)}
  .dtop{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
  .dtop .dn{font-weight:700;font-size:15px}.dtop .dpos{margin-left:auto;font:700 15px var(--mono);color:var(--green)}.dtop .dpos small{color:var(--muted);font-weight:400;font-size:12px}
  .dest{font-size:12.5px;color:var(--muted);margin-bottom:9px}.dest b{color:var(--text)}
  .dnext{font-size:13px;margin-top:8px}.dnext b{color:var(--amber)}

  /* шкала-трасса 0..10 */
  .track{position:relative;height:30px;margin:4px 0}
  .track .rail{position:absolute;top:13px;left:0;right:0;height:5px;border-radius:99px;background:var(--bg2)}
  .track .fill{position:absolute;top:13px;left:0;height:5px;border-radius:99px;background:linear-gradient(90deg,var(--green-dim),var(--green))}
  .track .tick{position:absolute;top:9px;width:2px;height:13px;background:var(--line2);transform:translateX(-1px)}
  .track .tick.done{background:var(--green-dim)}
  .track .tick.next{background:var(--amber);width:3px;height:17px;top:7px}
  .track .you{position:absolute;top:-3px;transform:translateX(-50%);font:700 10px var(--mono);color:var(--green);white-space:nowrap}
  .track .you::after{content:"▼";display:block;text-align:center;font-size:9px;margin-top:-1px}
  .track .zero,.track .ten{position:absolute;top:20px;font:600 9px var(--mono);color:var(--muted)}
  .track .zero{left:0}.track .ten{right:0}

  /* ===== страница направления ===== */
  .hero{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow-sm);margin-bottom:8px}
  .hero h1{margin-bottom:6px}
  .hero .destbox{background:var(--green-soft);border:1px solid var(--green-dim);border-radius:10px;padding:9px 12px;font-size:13.5px;margin:8px 0 4px}
  .hero .destbox b{color:var(--green)}
  .nowrow{display:flex;align-items:center;gap:16px;margin:14px 0 4px;flex-wrap:wrap}
  .nowrow .big{font:700 30px var(--mono);color:var(--green);line-height:1}
  .nowrow .big small{font-size:14px;color:var(--muted)}
  .nowrow .calc{font-size:12px;color:var(--muted);max-width:340px}
  .nowrow .calc b{color:var(--text)}
  .bigtrack{margin:14px 0 6px}
  .ms{font-size:13px;padding:5px 0;display:flex;gap:9px;align-items:baseline;border-top:1px solid var(--bg2)}
  .ms:first-of-type{border-top:0}
  .ms .mk{width:30px;font:700 11px var(--mono);color:var(--muted);flex:0 0 auto}
  .ms .mt{flex:1}.ms.done .mt{color:var(--muted);text-decoration:line-through}
  .ms.next{background:rgba(168,119,8,.08);border-radius:8px;margin:2px -6px;padding:6px;border-top:0}
  .ms.next .mt{font-weight:700}.ms.next .nb{font:600 9px var(--mono);background:var(--amber);color:#fff;border-radius:5px;padding:2px 6px}

  /* связи со всеми разделами */
  .connwrap{margin-top:14px}
  .conn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:680px){.conn{grid-template-columns:1fr}}
  .cc{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm);padding:10px 13px}
  .cc.empty{opacity:.5}
  .cc h4{margin:0 0 6px;font-size:12.5px;display:flex;align-items:center;gap:7px}
  .cc h4 .go{margin-left:auto;font:600 10px var(--mono);color:var(--green);cursor:pointer}
  .cc .ci{font-size:13px;padding:4px 0;border-top:1px solid var(--bg2);display:flex;gap:7px;align-items:baseline}
  .cc .ci:first-of-type{border-top:0}
  .cc .ci .pill{font:600 10px var(--mono);padding:1px 7px;border-radius:20px;background:var(--bg2);color:var(--muted);margin-left:auto;white-space:nowrap}
  .cc .none{font-size:12px;color:var(--muted)}
  .callout{background:var(--green-soft);border:1px solid var(--green-dim);border-radius:11px;padding:9px 13px;margin:14px 0;font-size:12.5px}
  .callout b{color:var(--green)}
  .foot{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<div class="titlebar">PIPBOY · ТРАЕКТОРИИ К 10 — МОКАП (цель как трасса, прошитая через все разделы)</div>
<div class="wrap" id="app"></div>

<script>
//==== разделы приложения (нитки идут в каждый) ====
const SECT={goals:['🎯','Цели / задачи'],money:['💰','Портфель / Финансы'],routines:['↻','Рутины'],
  tracking:['📊','Трекинг'],psy:['🧠','Психология'],info:['📝','Инфо'],people:['☻','Люди'],calendar:['📅','Календарь']};
const SORDER=['goals','money','routines','tracking','psy','info','people','calendar'];

//==== направления (цель = трасса к 10 + нитки во все разделы) ====
const DIRS={
  fire:{sphere:'Деньги / FIRE',name:'FIRE — финансовая независимость',pos:3.1,
    dest:'пассивный доход ≥ расходов: можно не работать ради денег',
    calc:'считается само: <b>31% капитала</b> от цели €1.0М (из Портфеля)',
    ms:[{at:2,t:'Подушка 6 месяцев',done:true},{at:3,t:'€300к капитала',done:true},
        {at:4,t:'Норма сбережений 40% + ребаланс',done:false,next:true},
        {at:6,t:'€500к + доход с Belgravia',done:false},{at:8,t:'€800к',done:false},{at:10,t:'Пассивный доход ≥ расходов',done:false}],
    next:'поднять норму сбережений до 40% и ребалансировать портфель',
    conn:{goals:[['Ребаланс портфеля по тезисам','задача'],['Поднять норму сбережений','задача']],
      money:[['Портфель €312к → цель €1.0М','31%'],['Расход €3.2к/мес','знаменатель цели']],
      routines:[['Заносить расходы','🔥12']],tracking:[['Капитал','↗ +0.4%/нед'],['Норма сбережений','31%']],
      info:[['Тезисы по рынку / макро','заметка']],calendar:[['Квартальный ребаланс','15.07']],psy:[],people:[]}},

  health:{sphere:'Здоровье / тело',name:'Форма и энергия',pos:6,
    dest:'энергия стабильно 8/10, форма, падл без травм весь сезон',
    calc:'оценка сектора <b>6/10</b> (из недельной ревизии Колеса) + тянется трекингом сна/энергии',
    ms:[{at:3,t:'Режим сна 7.5ч',done:true},{at:5,t:'Зарядка в рутину',done:true},{at:6,t:'Падл 2×/нед',done:true},
        {at:7,t:'Растяжка после падла (колено)',done:false,next:true},{at:8,t:'10к шагов + силовая',done:false},{at:10,t:'Энергия 8/10 стабильно',done:false}],
    next:'добавить растяжку после падла — бережём колено',
    conn:{goals:[['Падл — лига к сентябрю','40%'],['Наладить сон','в работе']],
      money:[],routines:[['Зарядка / мобилити','🔥18'],['Витамины + миноксидил','🔥42'],['10 000 шагов','🔥4']],
      tracking:[['Сон','7.2ч'],['Энергия','7/10'],['Вес','77.8кг']],psy:[['Дыхание 5 мин','🔥9'],['Растяжка','практика']],
      info:[['Протокол сна','заметка'],['Падл — техника удара','заметка']],people:[['Аня — партнёр по падлу','вт/чт']],
      calendar:[['Чек-ап у врача','запланировать']]}},

  belgravia:{sphere:'Деньги / FIRE',name:'Belgravia — сдать в аренду',pos:7,
    dest:'сдано, стабильный доход €1 800/мес, всё оформлено',
    calc:'<b>7/10</b> = 5 из 7 вех пути выполнено',
    ms:[{at:3,t:'Оценка рынка',done:true},{at:5,t:'Депозит/договор с Димой',done:true},{at:7,t:'Уборка + фото',done:true},
        {at:8,t:'Показ и заселение',done:false,next:true},{at:10,t:'Стабильный доход 3 мес',done:false}],
    next:'финальные фото и показ — договориться с Димой',
    conn:{goals:[['Чек-лист сдачи квартиры','3 пункта']],money:[['Аренда','€1 800/мес'],['Комиссия Диме','€900']],
      routines:[],tracking:[],psy:[],info:[['Чек-лист сдачи квартиры','заметка']],
      people:[['Дима — агент','показ']],calendar:[['Показ квартиры','эта неделя']]}},

  spanish:{sphere:'Развитие',name:'Испанский — B1',pos:1.5,
    dest:'свободно общаюсь на B1, сдан экзамен',
    calc:'<b>15%</b> курса A2→B1 пройдено',
    ms:[{at:1,t:'Выбрать курс',done:true},{at:2,t:'20 мин/день в рутину',done:false,next:true},{at:5,t:'Сдать A2',done:false},{at:8,t:'Разговорный клуб',done:false},{at:10,t:'Сдать B1',done:false}],
    next:'закрепить ежедневные 20 минут как рутину',
    conn:{goals:[['Испанский — B1 за полгода','15%']],money:[],routines:[['Испанский 20 мин','🔥6'],['Anki карточки','🔥2']],
      tracking:[['Минут учёбы','35/день'],['Слов в Anki','164']],psy:[['Фокус-сессия 25 мин','🔥7']],
      info:[['Книги и курсы','заметка'],['Конспект грамматики','заметка']],people:[],calendar:[['Тест A2','план']]}},
};
const SPHERES=[...new Set(Object.values(DIRS).map(d=>d.sphere))];

let route='main';
function go(r){route=r;render();window.scrollTo(0,0);}
function render(){route==='main'?renderMain():renderDir(route);}

//==== трасса 0..10 ====
function track(d,big=false){const ms=d.ms;const nextAt=(ms.find(m=>m.next)||{}).at;
  return `<div class="track" style="${big?'height:36px':''}">
    <div class="rail"></div><div class="fill" style="width:${d.pos*10}%"></div>
    ${ms.map(m=>`<div class="tick ${m.done?'done':''} ${m.next?'next':''}" style="left:${m.at*10}%"></div>`).join('')}
    <div class="you" style="left:${d.pos*10}%">${d.pos}</div>
    <div class="zero">0</div><div class="ten">10 ✦</div></div>`;}

//==== ГЛАВНАЯ ====
function renderMain(){
  document.getElementById('app').innerHTML=`
    <h1>Траектории жизни</h1>
    <div class="sub">Каждое направление — трасса к 10. Видно: <b>куда</b> (10), <b>где сейчас</b> (само считается) и <b>какой шаг</b>. Клик — все связи по разделам.</div>
    ${SPHERES.map(sp=>`<div class="sphlbl">${sp}</div>
      ${Object.entries(DIRS).filter(([,d])=>d.sphere===sp).map(([id,d])=>`
        <div class="dir" data-go="${id}">
          <div class="dtop"><span class="dn">${d.name}</span><span class="dpos">${d.pos}<small>/10</small></span></div>
          <div class="dest">10 = <b>${d.dest}</b></div>
          ${track(d)}
          <div class="dnext">→ шаг: <b>${d.next}</b></div>
        </div>`).join('')}`).join('')}
    <div class="foot">Это и есть «двигатель прогресса»: позиция на шкале берётся из подключённых данных (Портфель, ревизия, вехи), а не вводится руками. Колесо — просто эти же оценки, собранные в круг.</div>`;
  document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go));
}

//==== СТРАНИЦА НАПРАВЛЕНИЯ ====
function renderDir(id){const d=DIRS[id];const nextMs=d.ms.find(m=>m.next);
  const filled=SORDER.filter(k=>d.conn[k]&&d.conn[k].length).length;
  document.getElementById('app').innerHTML=`
    <div class="crumb"><a data-home>← Траектории</a> · <b>${d.sphere}</b></div>
    <div class="hero">
      <h1>${d.name}</h1>
      <div class="destbox">🎯 <b>10 = ${d.dest}</b></div>
      <div class="nowrow">
        <div><div class="big">${d.pos}<small>/10</small></div></div>
        <div class="calc">где сейчас: ${d.calc}</div>
      </div>
      <div class="bigtrack">${track(d,true)}</div>
      <div style="margin-top:8px">
        ${d.ms.map(m=>`<div class="ms ${m.done?'done':''} ${m.next?'next':''}">
          <span class="mk">${m.at}/10</span><span class="mt">${m.t}</span>
          ${m.next?'<span class="nb">ТЫ ЗДЕСЬ → ШАГ</span>':(m.done?'<span style="color:var(--green-dim)">✓</span>':'')}</div>`).join('')}
      </div>
    </div>

    <div class="callout">🔗 <b>Эта цель прошита через ${filled} из 8 разделов.</b> Прогресс реальный, потому что собирается из них — ничего отдельно не трекаешь.</div>

    <div class="connwrap"><div class="conn">
      ${SORDER.map(k=>{const items=d.conn[k]||[];const [ic,nm]=SECT[k];
        return `<div class="cc ${items.length?'':'empty'}">
          <h4>${ic} ${nm}${items.length?'<span class="go">открыть →</span>':''}</h4>
          ${items.length?items.map(([t,tag])=>`<div class="ci"><span>${t}</span><span class="pill">${tag}</span></div>`).join('')
            :'<div class="none">— ничего не привязано</div>'}</div>`;}).join('')}
    </div></div>
    <div class="foot">Сверху — «куда / где / шаг». Снизу — нитки во все разделы: задача живёт в Целях, деньги в Портфеле, привычка в Рутинах, цифры в Трекинге, текст в Инфо. Меняешь там — двигается трасса тут.</div>`;
  document.querySelector('[data-home]').onclick=()=>go('main');
  document.querySelectorAll('.cc .go').forEach(g=>g.onclick=()=>alert('Переход в соответствующий раздел (Цели/Портфель/Рутины/…) — данные живут там, тут только связь.'));
}

render();
</script>
</body>
</html>
