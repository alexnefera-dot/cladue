<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipboy · Second Brain — рабочий прототип</title>
<style>
  :root{
    --bg:#f6f7f9;--bg2:#eef0f4;--panel:#fff;--panel2:#e9edf1;--line:#e2e7ed;--line2:#d6dce4;
    --green:#1e9e57;--green-dim:#5cb585;--green-soft:rgba(30,158,87,.10);
    --text:#141e28;--muted:#4f5f6f;--nav:#364656;--amber:#a87708;--red:#c43f3f;--blue:#2a76b5;--violet:#6b4fb5;
    --shadow-sm:0 1px 2px rgba(18,28,45,.05),0 1px 4px rgba(18,28,45,.05);--shadow-md:0 6px 20px rgba(18,28,45,.10);
    --mono:"SF Mono","JetBrains Mono",ui-monospace,monospace;--sans:-apple-system,"SF Pro Text","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .titlebar{height:40px;background:var(--bg2);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    font:600 12px var(--mono);color:var(--green);letter-spacing:1px;flex:0 0 auto}
  .layout{flex:1;display:flex;min-height:0}
  .side{width:208px;background:var(--bg2);border-right:1px solid var(--line);padding:10px 9px;flex:0 0 auto;display:flex;flex-direction:column;gap:2px;overflow:auto}
  .side .srch{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 9px;font:13px var(--sans);background:var(--panel);margin-bottom:8px}
  .side .item{padding:8px 11px;border-radius:8px;color:var(--nav);font-size:13.5px;font-weight:600;cursor:pointer;user-select:none;display:flex;gap:9px;align-items:center}
  .side .item:hover{background:rgba(255,255,255,.8)}
  .side .item.on{background:var(--green-soft);color:var(--green)}
  .side .ni{width:18px;text-align:center}
  .side .sp{flex:1}
  .side .reset{margin-top:6px;font-size:11px;color:var(--muted);cursor:pointer;text-align:center;padding:6px}
  .main{flex:1;overflow:auto;padding:18px 26px 60px}
  .maxw{max-width:900px}

  h2{font-size:21px;letter-spacing:-.02em;margin:0 0 2px}
  .sec{font:600 10.5px var(--mono);letter-spacing:1.6px;color:var(--green);text-transform:uppercase;margin:18px 0 8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px;box-shadow:var(--shadow-sm)}
  .muted{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:4px;font:600 11px var(--mono);padding:3px 9px;border-radius:20px;background:var(--bg2);color:var(--muted)}
  .pill.goal{background:rgba(30,158,87,.12);color:var(--green)}
  .pill.note{background:rgba(42,118,181,.12);color:var(--blue)}
  .pill.person{background:rgba(168,119,8,.14);color:var(--amber)}
  .pill.money{background:rgba(196,63,63,.12);color:var(--red)}
  .pill.area{background:rgba(107,79,181,.13);color:var(--violet)}
  .pill.day{background:#e7ebf0;color:var(--nav)}
  .tag{font-size:11px;color:var(--blue);background:rgba(42,118,181,.08);border-radius:5px;padding:1px 6px}
  .hint{font-size:12px;color:var(--muted);margin-top:8px}
  kbd{font:11px var(--mono);background:var(--bg2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 5px}
  .wl{color:var(--green);font-weight:600;cursor:pointer;border-bottom:1px solid var(--green-soft)}
  .wl.missing{color:var(--amber);border-color:rgba(168,119,8,.25)}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .gcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 13px;box-shadow:var(--shadow-sm);cursor:pointer;transition:.12s}
  .gcard:hover{border-color:var(--green-dim);transform:translateY(-1px)}
  .gcard .gt{font-weight:700;margin:5px 0 2px}
  .gcard .gm{font-size:12px;color:var(--muted)}
  .bar{height:5px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--green-dim)}

  /* страница узла */
  .nodegrid{display:grid;grid-template-columns:1.5fr .9fr;gap:16px}
  @media(max-width:860px){.nodegrid{grid-template-columns:1fr}}
  .crumbs{font-size:12px;color:var(--muted);margin-bottom:8px}.crumbs a{color:var(--green);cursor:pointer}
  .ln{display:flex;gap:8px;align-items:baseline;padding:3px 0}
  .ln .bul{color:var(--line2);cursor:default;width:16px;flex:0 0 auto;text-align:center}
  .ln .bul.task{cursor:pointer;color:var(--green-dim)}
  .ln.done .tx{color:var(--muted);text-decoration:line-through}
  .rel{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--bg2);cursor:pointer}
  .rel:hover .rt{color:var(--green)}.rel .ar{font:12px var(--mono);color:var(--muted);width:18px}.rel .rt{flex:1}
  .bl{padding:8px 10px;border:1px dashed var(--line2);border-radius:9px;margin-bottom:6px;font-size:13px;cursor:pointer}
  .bl:hover{border-color:var(--green-dim)}.bl .blsrc{font-size:11px;color:var(--muted);margin-bottom:2px;display:flex;gap:6px;align-items:center}
  svg .edge{stroke:var(--line2);stroke-width:1.5}svg .ndot{cursor:pointer}svg text{font:600 10px var(--sans);fill:var(--text)}

  /* капча */
  .cap{position:relative;margin:6px 0}
  .cap input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:14px var(--sans);background:var(--panel)}
  .cap input:focus{outline:none;border-color:var(--green-dim);box-shadow:0 0 0 3px var(--green-soft)}
  .acpop{position:absolute;left:0;right:0;top:44px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow-md);z-index:20;overflow:hidden;display:none}
  .acpop div{padding:8px 11px;cursor:pointer;display:flex;align-items:center;gap:7px;font-size:13px}
  .acpop div.k,.acpop div:hover{background:var(--green-soft)}

  /* PARA */
  .inboxbar{display:flex;gap:10px;align-items:center;border:1px dashed var(--green-dim);background:var(--green-soft);border-radius:11px;padding:8px 12px;margin-bottom:12px}
  .grid-para{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:860px){.grid-para{grid-template-columns:1fr 1fr}}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:var(--shadow-sm);min-height:90px}
  .col h3{margin:2px 4px 8px;font-size:13px;display:flex;gap:6px}.col h3 .c{margin-left:auto;font:600 11px var(--mono);color:var(--muted)}
  .col.drop{outline:2px dashed var(--green-dim);outline-offset:-4px;background:var(--green-soft)}
  .pitem{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 9px;margin-bottom:7px;font-size:13px;cursor:grab}
  .pitem:hover{border-color:var(--green-dim)}.pitem.drag{opacity:.4}.pitem .pm{font-size:11px;color:var(--muted)}

  /* граф view */
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .chip{font:600 11px var(--mono);padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--muted)}
  .chip.on{background:var(--green-soft);border-color:var(--green-dim);color:var(--green)}
</style>
</head>
<body>
<div class="titlebar">PIPBOY · SECOND BRAIN — РАБОЧИЙ ПРОТОТИП (данные сохраняются в браузере)</div>
<div class="layout">
  <nav class="side">
    <input class="srch" id="navsearch" placeholder="🔍 поиск по всему…">
    <div class="item" data-nav="day"><span class="ni">📅</span><span class="sp">Дневник</span></div>
    <div class="item" data-nav="goals"><span class="ni">🎯</span><span class="sp">Цели</span></div>
    <div class="item" data-nav="notes"><span class="ni">📝</span><span class="sp">Инфо</span></div>
    <div class="item" data-nav="people"><span class="ni">☻</span><span class="sp">Люди</span></div>
    <div class="item" data-nav="fin"><span class="ni">💰</span><span class="sp">Финансы</span></div>
    <div class="item" data-nav="psy"><span class="ni">🧠</span><span class="sp">Колесо</span></div>
    <div style="height:8px"></div>
    <div class="item" data-nav="graph"><span class="ni">🕸</span><span class="sp">Граф связей</span></div>
    <div class="item" data-nav="para"><span class="ni">🗂</span><span class="sp">PARA</span></div>
    <div class="reset" id="resetbtn">↺ сбросить демо-данные</div>
  </nav>
  <main class="main"><div class="maxw" id="main"></div></main>
</div>

<script>
//==================== СИД-ДАННЫЕ (твой домен, плотнее) ====================
// узел: {type, title, body:[строки], props:{}}  — связи берутся из [[Название]] в body
const SEED = { nodes: {
  // --- цели ---
  belgravia:{type:'goal',title:'Belgravia — сдать в аренду',props:{progress:70,bucket:'proj',deadline:'01.08'},body:[
    '☑ сделать оценку рынка аренды района',
    '☐ финальная уборка и фото — договориться с [[Дима]]',
    '☐ пройтись по [[Чек-лист сдачи квартиры]] перед показом',
    'доход пойдёт в подушку и частично в [[FIRE]]',
    'денежный поток: [[Аренда · €1 800/мес]]']},
  fire:{type:'goal',title:'FIRE — капитал к 2032',props:{progress:31,bucket:'area'},body:[
    'цель: пассивный доход ≥ расходов; тело — [[Портфель · €312 400]]',
    '☐ ребаланс по [[Тезисы по рынку / макро]]',
    'ускоряет: доход от [[Belgravia]]']},
  padel:{type:'goal',title:'Падл — лига к сентябрю',props:{progress:40,bucket:'proj'},body:[
    '☐ 2 тренировки в неделю с [[Аня]]',
    '☐ разобрать [[Падл — техника удара]]',
    'часть сферы [[Здоровье / тело]]']},
  spanish:{type:'goal',title:'Испанский — B1 за полгода',props:{progress:15,bucket:'proj'},body:[
    '☐ 20 мин в день, материалы в [[Книги и курсы]]',
    'часть сферы [[Развитие]]']},
  setup:{type:'goal',title:'Рабочий сетап — апгрейд',props:{progress:20,bucket:'proj'},body:[
    '☐ второй монитор','☐ кресло','мелочь, но мешает каждый день']},
  // --- инфо/заметки ---
  checklist:{type:'note',title:'Чек-лист сдачи квартиры',props:{bucket:'res'},body:[
    'счётчики переписать · депозит 1 мес · опись техники',
    'фото при свете · договор с [[Дима]]','относится к [[Belgravia]]']},
  macro:{type:'note',title:'Тезисы по рынку / макро',props:{bucket:'res'},body:[
    'фаза: поздний цикл, кэш-подушка 6 мес','докупать на просадках; стратегия — в [[FIRE]]']},
  padeltech:{type:'note',title:'Падл — техника удара',props:{bucket:'res'},body:[
    'бэкхенд: разворот корпуса раньше','к цели [[Падл]]']},
  books:{type:'note',title:'Книги и курсы',props:{bucket:'res'},body:[
    'Español: курс A2→B1','для [[Испанский]]']},
  ideas:{type:'note',title:'Идеи на выходные',props:{bucket:'res'},body:[
    'веломаршрут вдоль реки','новый бар в центре','подпитка сферы [[Отдых]]']},
  // --- люди ---
  mama:{type:'person',title:'Мама',props:{bday:'через 21 дн',rhythm:'созвон 3 дн'},body:[
    'ДР через 3 недели — придумать подарок','часть сферы [[Отношения]]']},
  dima:{type:'person',title:'Дима',props:{rhythm:'14 дн'},body:[
    'агент по аренде, ведёт [[Belgravia]]','комиссия €900 разово']},
  anya:{type:'person',title:'Аня',props:{rhythm:'каждую неделю'},body:[
    'партнёр по [[Падл]], играем по вт/чт']},
  // --- финансы ---
  portfolio:{type:'money',title:'Портфель · €312 400',props:{},body:['тело капитала для [[FIRE]]']},
  rent:{type:'money',title:'Аренда · €1 800/мес',props:{},body:['поток от [[Belgravia]]']},
  debt:{type:'money',title:'Долг другу · €500',props:{},body:['вернуть до конца месяца']},
  // --- колесо (сферы) ---
  health:{type:'area',title:'Здоровье / тело',props:{score:6},body:['двигатель: [[Падл]], сон, еда']},
  relations:{type:'area',title:'Отношения',props:{score:8},body:['ближний круг: [[Мама]], друзья']},
  moneyarea:{type:'area',title:'Деньги',props:{score:7},body:['курс на [[FIRE]]']},
  growth:{type:'area',title:'Развитие',props:{score:5},body:['сейчас фокус — [[Испанский]]']},
  rest:{type:'area',title:'Отдых',props:{score:4},body:['проседает; идеи в [[Идеи на выходные]]']},
  // --- дни (дневник) ---
  'day-today':{type:'day',title:'17 июня · вторник',props:{},body:[
    '☐ позвонить [[Дима]] по [[Belgravia]] — дата показа',
    'мысль: аренда ниже 4% → лучше в [[FIRE]]',
    '☑ тренировка [[Падл]] с [[Аня]] — бэкхенд ок',
    'у [[Мама]] скоро ДР — подарок','чек-ин 🙂 · энергия 7/10']},
  'day-15':{type:'day',title:'15 июня · воскресенье',props:{},body:[
    'записался в лигу [[Падл]]','прочитал главу для [[Испанский]]']},
  'day-12':{type:'day',title:'12 июня · четверг',props:{},body:[
    'депозит по [[Belgravia]] пришёл','довнёс €1 200 в [[Портфель · €312 400]]']},
}};

//==================== состояние/хранилище ====================
const KEY='pipboy_sb_v2';
let DB = (()=>{try{const j=JSON.parse(localStorage.getItem(KEY));return j&&j.nodes?j:null}catch{return null}})() || structuredClone(SEED);
const save=()=>localStorage.setItem(KEY,JSON.stringify(DB));
let view={k:'day'}, hist=[];

const TYPE_RU={goal:'цель',note:'инфо',person:'человек',money:'финансы',area:'сфера',day:'день'};
const TYPE_COL={goal:'#1e9e57',note:'#2a76b5',person:'#a87708',money:'#c43f3f',area:'#6b4fb5',day:'#364656'};

//==================== связи (ядро второго мозга) ====================
const titleId=()=>{const m={};for(const [id,n] of Object.entries(DB.nodes))m[n.title.toLowerCase()]=id;return m;};
const idByTitle=t=>titleId()[String(t).toLowerCase()];
const mentions=line=>[...String(line).matchAll(/\[\[([^\]]+)\]\]/g)].map(m=>m[1]);
function outLinks(id){const seen=new Set();const out=[];
  for(const line of DB.nodes[id].body) for(const t of mentions(line)){const tid=idByTitle(t);
    if(tid&&tid!==id&&!seen.has(tid)){seen.add(tid);out.push({id:tid,ctx:line});}}
  return out;}
function backLinks(id){const T=DB.nodes[id].title.toLowerCase();const res=[];
  for(const [mid,n] of Object.entries(DB.nodes)){if(mid===id)continue;
    for(const line of n.body) if(mentions(line).some(x=>x.toLowerCase()===T)){res.push({id:mid,ctx:line});break;}}
  return res;}
const hl=s=>String(s).replace(/\[\[([^\]]+)\]\]/g,(m,t)=>{const id=idByTitle(t);
  return `<span class="wl ${id?'':'missing'}" data-link="${t.replace(/"/g,'&quot;')}">${t}</span>`;});

//==================== навигация ====================
function open(id){if(!DB.nodes[id])return;hist.push(view);if(hist.length>12)hist.shift();view={k:'node',id};render();}
function nav(k){view={k};hist=[];render();}
document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>nav(el.dataset.nav));
document.getElementById('navsearch').addEventListener('input',e=>{
  const q=e.target.value.trim(); if(!q){if(view.k==='search')nav('day');return;} view={k:'search',q};render();});
document.getElementById('resetbtn').onclick=()=>{if(confirm('Сбросить демо к исходным данным?')){DB=structuredClone(SEED);save();nav('day');}};

//==================== капча с автодополнением [[ ====================
function makeCapture(placeholder,onCommit){
  const wrap=document.createElement('div');wrap.className='cap';
  wrap.innerHTML=`<input placeholder="${placeholder}" autocomplete="off"><div class="acpop"></div>`;
  const input=wrap.querySelector('input'),pop=wrap.querySelector('.acpop');
  let items=[],k=-1;
  const names=()=>Object.values(DB.nodes).map(n=>n.title);
  function openAc(q){const ms=names().filter(n=>n.toLowerCase().includes(q.toLowerCase())).slice(0,6);
    items=[...ms,q?('＋ создать «'+q+'»'):null].filter(Boolean);k=0;
    pop.innerHTML=items.map((m,i)=>{const known=idByTitle(m);
      return `<div class="${i===0?'k':''}" data-i="${i}">${known?`<span class="pill ${DB.nodes[known].type}">${TYPE_RU[DB.nodes[known].type]}</span>`:'<span class="pill">новый</span>'} ${m}</div>`;}).join('');
    pop.style.display='block';}
  const closeAc=()=>{pop.style.display='none';items=[];k=-1;};
  function apply(i){const pick=items[i];if(!pick)return;
    const name=pick.startsWith('＋ создать')?pick.replace(/^＋ создать «(.+)»$/,'$1'):pick;
    input.value=input.value.replace(/\[\[[^\]]*$/,'[['+name+']] ');closeAc();input.focus();}
  input.addEventListener('input',()=>{const m=input.value.match(/\[\[([^\]]*)$/);m?openAc(m[1]):closeAc();});
  input.addEventListener('keydown',e=>{
    if(pop.style.display==='block'){
      if(e.key==='ArrowDown'){e.preventDefault();k=(k+1)%items.length;}
      else if(e.key==='ArrowUp'){e.preventDefault();k=(k-1+items.length)%items.length;}
      else if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();apply(k);return;}
      else if(e.key==='Escape'){closeAc();return;}
      pop.querySelectorAll('div').forEach((d,i)=>d.classList.toggle('k',i===k));return;}
    if(e.key==='Enter'&&input.value.trim()){onCommit(input.value.trim());input.value='';}});
  pop.addEventListener('click',e=>{const d=e.target.closest('[data-i]');if(d)apply(+d.dataset.i);});
  return wrap;
}
// создаёт недостающие узлы для [[X]], которых ещё нет
function ensureNodes(text){for(const t of mentions(text)){if(!idByTitle(t)){
  const id='n'+Date.now()+Math.floor(Math.random()*99);
  DB.nodes[id]={type:'note',title:t,props:{bucket:'res'},body:['(создано из ссылки)']};}}}

//==================== РЕНДЕР ====================
const M=()=>document.getElementById('main');
function render(){
  document.querySelectorAll('[data-nav]').forEach(el=>el.classList.toggle('on',el.dataset.nav===view.k));
  if(view.k==='node')return renderNode(view.id);
  if(view.k==='day')return renderDay();
  if(view.k==='graph')return renderGraph();
  if(view.k==='para')return renderPara();
  if(view.k==='search')return renderSearch(view.q);
  return renderList(view.k);
}
// клики по [[ссылкам]] везде
M().addEventListener('click',e=>{const w=e.target.closest('.wl');if(!w)return;
  const t=w.dataset.link;let id=idByTitle(t);
  if(!id){id='n'+Date.now();DB.nodes[id]={type:'note',title:t,props:{bucket:'res'},body:['(новая страница)']};save();}
  open(id);});

function bodyHtml(id){const n=DB.nodes[id];
  return n.body.map((line,i)=>{const task=/^([☐☑])\s/.test(line);const done=line.startsWith('☑');
    const tx=line.replace(/^([☐☑])\s/,'');
    return `<div class="ln ${done?'done':''}"><span class="bul ${task?'task':''}" data-task="${id}:${i}">${task?(done?'☑':'☐'):'•'}</span><span class="tx">${hl(tx)}</span></div>`;}).join('');}

function renderNode(id){const n=DB.nodes[id];const out=outLinks(id),back=backLinks(id);
  M().innerHTML=`
    <div class="crumbs">${hist.length?'<a id="back">← назад</a> · ':''}<span class="pill ${n.type}">${TYPE_RU[n.type]}</span></div>
    <h2>${n.title}</h2>
    <div class="muted" style="margin-bottom:6px">${propLine(n)}</div>
    ${typeof n.props.progress==='number'?`<div class="bar" style="max-width:320px"><i style="width:${n.props.progress}%"></i></div>`:''}
    <div class="nodegrid" style="margin-top:14px">
      <div>
        <div class="card"><div class="sec" style="margin-top:0">Содержимое</div>
          <div id="nbody">${bodyHtml(id)}</div>
          <div id="addrow" style="margin-top:6px"></div>
        </div>
      </div>
      <div>
        <div class="card"><div class="sec" style="margin-top:0">→ Связи (${out.length})</div>
          ${out.length?out.map(o=>`<div class="rel" data-id="${o.id}"><span class="ar">→</span>
            <span class="pill ${DB.nodes[o.id].type}">${TYPE_RU[DB.nodes[o.id].type]}</span>
            <span class="rt">${DB.nodes[o.id].title}</span></div>`).join('')
            :'<div class="muted" style="font-size:13px">нет ссылок — добавь [[…]] в текст</div>'}</div>
        <div class="card"><div class="sec" style="margin-top:0">↩ Упоминания (${back.length})</div>
          ${back.length?back.map(b=>`<div class="bl" data-id="${b.id}">
            <div class="blsrc"><span class="pill ${DB.nodes[b.id].type}">${TYPE_RU[DB.nodes[b.id].type]}</span>${DB.nodes[b.id].title}</div>
            ${hl(b.ctx.replace(/^([☐☑])\s/,''))}</div>`).join('')
            :'<div class="muted" style="font-size:13px">пока никто не ссылается</div>'}</div>
        <div class="card"><div class="sec" style="margin-top:0">Локальный граф</div>
          <svg viewBox="0 0 320 190" width="100%" height="180" id="mg"></svg></div>
      </div>
    </div>`;
  document.getElementById('addrow').appendChild(makeCapture('＋ строка (можно [[ссылку]])…',txt=>{
    ensureNodes(txt);DB.nodes[id].body.push(txt);save();renderNode(id);}));
  M().querySelectorAll('.rel,.bl').forEach(el=>el.onclick=()=>open(el.dataset.id));
  const bk=document.getElementById('back');if(bk)bk.onclick=()=>{view=hist.pop()||{k:'day'};render();};
  M().querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{const [nid,li]=b.dataset.task.split(':');
    const L=DB.nodes[nid].body;L[li]=L[li].startsWith('☑')?L[li].replace('☑','☐'):L[li].replace('☐','☑');save();renderNode(nid);});
  drawGraph(id,'mg');
}
function propLine(n){const p=n.props;const a=[];
  if(p.deadline)a.push('дедлайн '+p.deadline);
  if(typeof p.progress==='number')a.push('прогресс '+p.progress+'%');
  if(p.score)a.push('колесо '+p.score+'/10');
  if(p.bday)a.push('ДР '+p.bday);if(p.rhythm)a.push('ритм '+p.rhythm);
  return a.join(' · ')||TYPE_RU[n.type];}

function drawGraph(center,svgId){const svg=document.getElementById(svgId);if(!svg)return;
  const neigh=[...new Set([...outLinks(center).map(o=>o.id),...backLinks(center).map(b=>b.id)])].slice(0,7);
  const cx=160,cy=95;let edges='',dots='';
  neigh.forEach((id,i)=>{const ang=(Math.PI*2*i)/neigh.length-Math.PI/2,x=cx+Math.cos(ang)*120,y=cy+Math.sin(ang)*68;
    const ty=DB.nodes[id].type;edges+=`<line class="edge" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`;
    dots+=`<g class="ndot" data-g="${id}"><circle cx="${x}" cy="${y}" r="7" fill="${TYPE_COL[ty]}"/>
      <text x="${x}" y="${y-11}" text-anchor="middle">${DB.nodes[id].title.slice(0,12)}</text></g>`;});
  svg.innerHTML=edges+dots+`<circle cx="${cx}" cy="${cy}" r="11" fill="#141e28"/>
    <text x="${cx}" y="${cy+24}" text-anchor="middle" style="font-weight:700">${DB.nodes[center].title.slice(0,16)}</text>`;
  svg.querySelectorAll('.ndot').forEach(g=>g.onclick=()=>open(g.dataset.g));}

function renderDay(){const id='day-today';const n=DB.nodes[id];
  // все дни, свежие сверху
  const days=Object.entries(DB.nodes).filter(([,x])=>x.type==='day');
  M().innerHTML=`<h2>Дневник</h2><div class="muted">пиши свободно, ставь [[ссылки]] — они тянут к целям/людям/темам</div>
    <div class="card"><div class="sec" style="margin-top:0">📅 ${n.title}</div>
      <div id="cap"></div><div id="todaylog" style="margin-top:8px">${bodyHtml(id)}</div></div>
    <div class="sec">Прошлые дни</div>
    ${days.filter(([d])=>d!=='day-today').map(([d,x])=>`<div class="card"><div class="sec" style="margin-top:0">${x.title}</div>${x.body.map(l=>`<div class="ln"><span class="bul">${/^[☐☑]/.test(l)?l[0]:'•'}</span><span class="tx">${hl(l.replace(/^([☐☑])\s/,''))}</span></div>`).join('')}</div>`).join('')}
    <p class="hint">Это и есть «капча»: одна форма ввода, а структура (цели, люди, темы) собирается из ссылок.</p>`;
  document.getElementById('cap').appendChild(makeCapture('Что в голове? Набери [[ для ссылки, Enter — добавить…',txt=>{
    ensureNodes(txt);DB.nodes[id].body.push(txt);save();renderDay();}));
  M().querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{const [nid,li]=b.dataset.task.split(':');
    const L=DB.nodes[nid].body;L[li]=L[li].startsWith('☑')?L[li].replace('☑','☐'):L[li].replace('☐','☑');save();renderDay();});}

function renderList(k){const map={goals:'goal',notes:'note',people:'person',fin:'money',psy:'area'};
  const ty=map[k];const titleMap={goals:'Цели',notes:'Инфо',people:'Люди',fin:'Финансы',psy:'Колесо баланса'};
  const items=Object.entries(DB.nodes).filter(([,n])=>n.type===ty);
  M().innerHTML=`<h2>${titleMap[k]}</h2><div class="muted">${items.length} ${ty==='area'?'сфер':'шт.'} · клик — открыть карточку со связями</div>
    <div class="cards" style="margin-top:12px">${items.map(([id,n])=>`<div class="gcard" data-id="${id}">
      <span class="pill ${n.type}">${TYPE_RU[n.type]}</span><div class="gt">${n.title}</div>
      <div class="gm">${propLine(n)} · → ${outLinks(id).length} · ↩ ${backLinks(id).length}</div>
      ${typeof n.props.progress==='number'?`<div class="bar"><i style="width:${n.props.progress}%"></i></div>`:''}
      ${n.props.score?`<div class="bar"><i style="width:${n.props.score*10}%"></i></div>`:''}</div>`).join('')}</div>`;
  M().querySelectorAll('.gcard').forEach(c=>c.onclick=()=>open(c.dataset.id));}

function renderSearch(q){const ql=q.toLowerCase();
  const hits=Object.entries(DB.nodes).filter(([,n])=>(n.title+' '+n.body.join(' ')).toLowerCase().includes(ql));
  M().innerHTML=`<h2>Поиск: «${q}»</h2><div class="muted">${hits.length} совпадений по названиям и тексту</div>
    <div class="cards" style="margin-top:12px">${hits.map(([id,n])=>`<div class="gcard" data-id="${id}">
      <span class="pill ${n.type}">${TYPE_RU[n.type]}</span><div class="gt">${n.title}</div>
      <div class="gm">${n.body.find(l=>l.toLowerCase().includes(ql))?hl(n.body.find(l=>l.toLowerCase().includes(ql)).replace(/^([☐☑])\s/,'')):propLine(n)}</div></div>`).join('')
      ||'<div class="muted">ничего не найдено</div>'}</div>`;
  M().querySelectorAll('.gcard').forEach(c=>c.onclick=()=>open(c.dataset.id));}

//==================== ГРАФ view ====================
let gFilter='all';
function renderGraph(){
  M().innerHTML=`<h2>Граф связей</h2><div class="muted">вся база как сеть — фильтруй и ходи по связям</div>
    <div class="filters" id="gf" style="margin-top:10px">${['all','goal','area','note','person','money','day'].map(t=>`<span class="chip ${t===gFilter?'on':''}" data-f="${t}">${t==='all'?'все':TYPE_RU[t]}</span>`).join('')}</div>
    <div class="cards">${Object.entries(DB.nodes).filter(([,n])=>gFilter==='all'||n.type===gFilter)
      .sort((a,b)=>(backLinks(b[0]).length+outLinks(b[0]).length)-(backLinks(a[0]).length+outLinks(a[0]).length))
      .map(([id,n])=>`<div class="gcard" data-id="${id}"><span class="pill ${n.type}">${TYPE_RU[n.type]}</span>
        <div class="gt">${n.title}</div><div class="gm">→ ${outLinks(id).length} связей · ↩ ${backLinks(id).length} упоминаний</div></div>`).join('')}</div>`;
  document.getElementById('gf').onclick=e=>{const c=e.target.closest('.chip');if(c){gFilter=c.dataset.f;renderGraph();}};
  M().querySelectorAll('.gcard').forEach(c=>c.onclick=()=>open(c.dataset.id));}

//==================== PARA view ====================
let dragId=null;
function paraBucket(n,id){if(n.props.bucket==='inbox')return'inbox';
  if(DB.nodes[id]._arch)return'arch';
  if(n.type==='goal')return n.props.bucket||'proj';
  if(n.type==='area')return'area';if(n.type==='note')return'res';
  if(n.type==='money')return'area';return null;}
function renderPara(){
  M().innerHTML=`<h2>PARA</h2><div class="muted">всё по степени действия. Перетаскивай карточки между корзинами.</div>
    <div class="inboxbar"><span class="pill">＋ ИНБОКС</span><div id="pcap" style="flex:1"></div></div>
    <div class="grid-para">
      ${[['proj','🎯 Проекты'],['area','🔄 Сферы'],['res','📚 Ресурсы'],['arch','🗄️ Архив']].map(([b,h])=>{
        const items=Object.entries(DB.nodes).filter(([id,n])=>paraBucket(n,id)===b);
        return `<div class="col" data-b="${b}"><h3>${h}<span class="c">${items.length}</span></h3>
          ${items.map(([id,n])=>`<div class="pitem" draggable="true" data-id="${id}">${n.title}<div class="pm">${propLine(n)}</div></div>`).join('')}</div>`;}).join('')}
    </div>
    <div class="col" data-b="inbox" style="margin-top:12px"><h3>📥 Не разобрано<span class="c">${Object.entries(DB.nodes).filter(([id,n])=>paraBucket(n,id)==='inbox').length}</span></h3>
      ${Object.entries(DB.nodes).filter(([id,n])=>paraBucket(n,id)==='inbox').map(([id,n])=>`<div class="pitem" draggable="true" data-id="${id}">${n.title}</div>`).join('')||'<div class="muted" style="font-size:12px">пусто</div>'}</div>
    <p class="hint">Перетаскивание меняет «корзину» узла (сохраняется). Проект↔Сфера для целей, в Архив — что закрыто.</p>`;
  document.getElementById('pcap').appendChild(makeCapture('кинуть в инбокс и Enter…',txt=>{
    const id='n'+Date.now();DB.nodes[id]={type:'note',title:txt,props:{bucket:'inbox'},body:['(из инбокса)']};save();renderPara();}));
  M().querySelectorAll('.pitem').forEach(it=>{it.ondragstart=()=>{dragId=it.dataset.id;it.classList.add('drag');};
    it.ondragend=()=>{it.classList.remove('drag');dragId=null;};it.onclick=()=>open(it.dataset.id);});
  M().querySelectorAll('.col').forEach(col=>{col.ondragover=e=>{e.preventDefault();col.classList.add('drop');};
    col.ondragleave=()=>col.classList.remove('drop');
    col.ondrop=e=>{e.preventDefault();col.classList.remove('drop');const id=dragId;if(!id)return;
      const b=col.dataset.b,n=DB.nodes[id];delete n._arch;
      if(b==='arch')n._arch=true;else if(b==='inbox')n.props.bucket='inbox';
      else if(n.type==='goal')n.props.bucket=(b==='area'?'area':'proj');else n.props.bucket=b;
      save();renderPara();};});}

render();
</script>
</body>
</html>
